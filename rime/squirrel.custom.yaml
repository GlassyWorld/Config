# squirrel.custom.yaml
# Personal appearance overrides for Squirrel
# encoding: utf-8

patch:
  style:
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true

    font_face: "Noto Emoji, 更纱黑体 UI SC"
    label_font_face: "更纱黑体 UI SC"
    comment_font_face: "更纱黑体 UI SC"
    font_point: 18
    label_font_point: 16
    comment_font_point: 16

    color_scheme: Catppuccin

    # Current Squirrel layout keys.
    border_width: 1
    border_height: 1
    spacing: 5
    corner_radius: 10
    hilited_corner_radius: 5
    shadow_size: 3

  preset_color_schemes/+:
    Catppuccin:
      name: "Catppuccin"
      author: "缄默线"
      back_color: 0x3A2724
      border_color: 0x3A2724
      candidate_text_color: 0xF5D3CA
      comment_text_color: 0x9FD4EE
      hilited_back_color: 0x261918
      hilited_candidate_back_color: 0x644D49
      hilited_candidate_text_color: 0xD6DBF4
      hilited_comment_text_color: 0x9FD4EE
      hilited_candidate_label_color: 0xCBADA5
      hilited_text_color: 0xF2AB89
      label_color: 0xA28780
      shadow_color: 0xAA000000
      text_color: 0xF5D3CA
