# Rime symbol master catalog
# Canonical source for personal symbol mappings.
#
# Model:
# - Every entry has one code, one category, one ordered symbol list, and one direct flag.
# - Every code is intended to be available as /code.
# - Only entries with direct: true are additionally exposed as bare code.
# - This file is the single source of truth; generated Rime files are derived artifacts.
#
# Primary reference:
#   wklchris/Rime-latex-symbols, latexmath.yaml (GPL-3.0)
#   upstream blob: 06448a858534f5ddc089695bd0f08600ec3280fc
#
# Phase 1 policy:
# - Preserve the upstream code set and candidate ordering.
# - Keep every entry direct: false.
# - Direct-safe codes will be selected separately in Phase 2.

