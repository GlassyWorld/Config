# default.custom.yaml
# Personal overrides for rime-frost
# encoding: utf-8

patch:
  # Only enable rime-frost (full pinyin).
  schema_list:
    - schema: rime_frost

  # Candidate count per page.
  menu/page_size: 6

  # Scheme switcher shortcuts.
  switcher/hotkeys:
    - Control+grave
    - F4

  # Make Right Shift behave like Left Shift: commit current code and switch to ASCII.
  ascii_composer/switch_key/Shift_R: commit_code

  # Keep personal full-/half-width toggle while inheriting upstream key bindings.
  key_binder/bindings/+:
    - { when: always, toggle: full_shape, accept: Shift+space }
